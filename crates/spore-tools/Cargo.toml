[package]
name = "spore-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "osptool: an offline inspector for Spore DBPF packages, record identity and decoded record structure."

[lib]
name = "spore_tools"
path = "src/lib.rs"

[[bin]]
name = "osptool"
path = "src/main.rs"

[dependencies]
spore-core = { workspace = true }
spore-dbpf = { workspace = true }
spore-gmdl = { workspace = true }
spore-rw4 = { workspace = true }
spore-texture = { workspace = true }
spore-assets = { workspace = true }