[package]
name = "spore-cellcontent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cell-stage gameplay configuration records: twelve flat decoders, typed cross-record references and graded domain invariants."

[dependencies]
spore-core = { workspace = true }
thiserror = { workspace = true }

# DEV-ONLY. The real-corpus tests need a package reader, which means
# `spore-assets`. It is a `[dev-dependencies]` entry on purpose: the library
# itself stays free of any container knowledge (it takes bytes, not packages),
# which is what keeps `spore-cellcontent` testable with no game install. No new
# external crate enters the workspace through this line -- `spore-assets` and
# its whole dependency closure already build for the rest of the workspace.
[dev-dependencies]
spore-assets = { workspace = true }
spore-dbpf = { workspace = true }