<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenSpore Knowledge Graph</title>
<link rel="stylesheet" href="/static/viewer.css">
</head>
<body>
<header id="topbar">
  <div>
    <h1>OpenSpore Knowledge Graph</h1>
    <div id="dbline"><span id="db-path"></span> <span id="db-state"></span></div>
  </div>
</header>
<div id="degraded-banner" hidden></div>
<nav id="tabs">
  <button id="tab-all" class="tab active" type="button">All nodes</button>
  <button id="tab-functions" class="tab" type="button">Functions</button>
</nav>
<main>
  <section id="summary" class="panel" aria-label="Project summary"></section>
  <section id="evidence" class="panel" aria-label="Evidence distribution"></section>
  <section id="inv-status" class="panel" aria-label="Investigation status"></section>
  <section id="subsystems" class="panel" aria-label="Subsystems"></section>
  <section id="nodes" class="panel" aria-label="Node inventory">
    <form id="node-search">
      <input name="q" placeholder="name substring" aria-label="name">
      <select name="label" aria-label="label"><option value="">all labels</option></select>
      <button type="submit">Search</button>
    </form>
    <div id="node-results"></div>
  </section>
  <section id="detail" class="panel" aria-label="Node detail" hidden></section>
</main>
<script src="/static/viewer.js"></script>
</body>
</html>
